<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Ajustes de Riff</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        padding: 28px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        background: #131315;
        color: rgba(255, 255, 255, 0.92);
        font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
        font-size: 14px;
      }

      h1 {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      p {
        color: rgba(255, 255, 255, 0.55);
        line-height: 1.55;
      }

      ol {
        color: rgba(255, 255, 255, 0.55);
        line-height: 1.7;
        padding-left: 18px;
      }

      a {
        color: #7aa2ff;
      }

      label {
        display: block;
        margin-bottom: 7px;
        color: rgba(255, 255, 255, 0.75);
        font-size: 13px;
      }

      input {
        width: 100%;
        padding: 11px 13px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.05);
        color: inherit;
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        font-size: 13px;
        outline: none;
      }

      input:focus {
        border-color: rgba(122, 162, 255, 0.7);
      }

      .row {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .status {
        flex: 1;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.5);
      }

      .status.ok {
        color: #5ddba0;
      }

      .status.bad {
        color: #ff6b6b;
      }

      button {
        padding: 10px 20px;
        border: none;
        border-radius: 10px;
        background: #f5f5f7;
        color: #131315;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <h1>Ajustes de Riff</h1>

    <p>
      Riff usa el plan gratuito de Groq: 8 horas de dictado al día, sin coste y sin tarjeta.
    </p>

    <ol>
      <li>Entra en <a href="https://console.groq.com/keys" target="_blank">console.groq.com/keys</a></li>
      <li>Crea una cuenta gratuita y pulsa «Create API Key»</li>
      <li>Copia la clave y pégala aquí abajo</li>
    </ol>

    <div>
      <label for="key">API key de Groq</label>
      <input id="key" type="password" placeholder="gsk_..." spellcheck="false" />
    </div>

    <div class="row">
      <span class="status" id="status"></span>
      <button id="save">Guardar</button>
    </div>

    <script>
      const invoke = window.__TAURI__.core.invoke;
      const field = document.getElementById("key");
      const status = document.getElementById("status");

      invoke("get_config")
        .then((config) => {
          field.value = config.api_key || "";
          if (config.api_key) {
            status.textContent = `Listo. Dicta con ${config.shortcut}.`;
            status.className = "status ok";
          }
        })
        .catch(() => {});

      document.getElementById("save").addEventListener("click", async () => {
        const value = field.value.trim();
        if (!value) {
          status.textContent = "Pega tu API key primero.";
          status.className = "status bad";
          return;
        }
        try {
          await invoke("save_api_key", { apiKey: value });
          status.textContent = "Guardada. Ya puedes dictar.";
          status.className = "status ok";
          setTimeout(() => invoke("close_settings"), 900);
        } catch (error) {
          status.textContent = String(error);
          status.className = "status bad";
        }
      });

      field.addEventListener("keydown", (event) => {
        if (event.key === "Enter") document.getElementById("save").click();
      });
    </script>
  </body>
</html>
